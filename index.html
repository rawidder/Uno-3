<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#161616" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>UNO Sieg-Zähler</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0d0d0d; }
body { -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
input { -webkit-user-select: text; user-select: text; }
#root { min-height: 100dvh; min-height: 100vh; }

@keyframes confettiFall {
  0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) translateX(var(--drift)) rotate(720deg); opacity: 1; }
}
@keyframes popFlash {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}
@keyframes overlayIn {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes crownPop {
  0%   { transform: scale(0) rotate(-25deg); }
  60%  { transform: scale(1.25) rotate(8deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.tile-flash { animation: popFlash 0.6s ease; }
.overlay-in { animation: overlayIn 0.25s ease; }
.crown-pop  { animation: crownPop 0.4s ease; }
</style>
</head>

let _audioCtx = null;
let _fanfareBuffer = null;
let _fanfareLoading = null;

function getAudioCtx() {
  if (!_audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) _audioCtx = new AC();
  }
  return _audioCtx;
}

function base64ToArrayBuffer(dataUri) {
  const b64 = dataUri.split(",")[1] || dataUri;
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function ensureFanfareLoaded() {
  if (_fanfareBuffer) return Promise.resolve(_fanfareBuffer);
  if (_fanfareLoading) return _fanfareLoading;
  const ctx = getAudioCtx();
  if (!ctx) return Promise.resolve(null);
  _fanfareLoading = new Promise((resolve) => {
    try {
      const buf = base64ToArrayBuffer(FANFARE_AUDIO);
      ctx.decodeAudioData(buf, (decoded) => {
        _fanfareBuffer = decoded;
        resolve(decoded);
      }, () => resolve(null));
    } catch(e) { resolve(null); }
  });
  return _fanfareLoading;
}

function playFanfare() {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    ensureFanfareLoaded().then(function(buffer) {
      if (!buffer) return;
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.value = 1.0;
      source.connect(gain);
      gain.connect(ctx.destination);
      source.start(0);
    });
  } catch(ex) {}
}

// ===== Confetti =====
function Confetti({ run }) {
  if (!run) return null;
  const palette = ["#D72600","#F9A800","#379711","#0956BF","#FFFFFF"];
  const pieces = Array.from({ length: 80 }, (_, i) => {
    const left = (Math.random() * 100).toFixed(1);
    const delay = (Math.random() * 0.3).toFixed(2);
    const dur = (1.6 + Math.random() * 1.4).toFixed(2);
    const size = (8 + Math.random() * 10).toFixed(1);
    const color = palette[i % palette.length];
    const rot = Math.floor(Math.random() * 360);
    const drift = Math.floor((Math.random() - 0.5) * 120);
    return e("span", {
      key: i,
      style: {
        position: "absolute", top: "-24px", left: left + "%",
        width: size + "px", height: (parseFloat(size)*1.4).toFixed(1) + "px",
        background: color, borderRadius: "2px",
        transform: "rotate(" + rot + "deg)",
        animation: "confettiFall " + dur + "s " + delay + "s ease-in forwards",
        "--drift": drift + "px",
      }
    });
  });
  return e("div", {
    style: {
      position: "fixed", inset: 0, pointerEvents: "none",
      overflow: "hidden", zIndex: 60,
    }
  }, ...pieces);
}

function App() {
  const [phase, setPhase] = useState("setup");
  const [numInput, setNumInput] = useState(2);
  const [setupNames, setSetupNames] = useState(["", ""]);
  const [players, setPlayers] = useState([]);
  const [showScore, setShowScore] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [newName, setNewName] = useState("");
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const [flashId, setFlashId] = useState(null);
  const idRef = useRef(1);

  function setupCountChange(n) {
    const count = Math.max(2, Math.min(15, n));
    setNumInput(count);
    setSetupNames(prev => {
      const next = prev.slice(0, count);
      while (next.length < count) next.push("");
      return next;
    });
  }

  function startGame() {
    const built = setupNames.map((nm, i) => ({
      id: idRef.current++,
      name: nm.trim() || ("Spieler " + (i+1)),
      wins: 0,
    }));
    setPlayers(built);
    setPhase("game");
  }

  function registerWin(id) {
    playFanfare();
    setPlayers(prev => prev.map(p => p.id === id ? { ...p, wins: p.wins + 1 } : p));
    setFlashId(id);
    setConfetti(false);
    requestAnimationFrame(() => setConfetti(true));
    setTimeout(() => setConfetti(false), 3200);
    setTimeout(() => setFlashId(null), 700);
  }

  function removeWin(id) {
    setPlayers(prev => prev.map(p => p.id === id ? { ...p, wins: Math.max(0, p.wins - 1) } : p));
  }

  function addPlayer() {
    const nm = newName.trim();
    setPlayers(prev => [...prev, { id: idRef.current++, name: nm || ("Spieler " + (prev.length+1)), wins: 0 }]);
    setNewName("");
    setShowAdd(false);
  }

  function resetScores() {
    setPlayers(prev => prev.map(p => ({ ...p, wins: 0 })));
    setShowResetConfirm(false);
    setShowScore(false);
  }

        justifyContent: "space-between",
        padding: "10px 12px",
        paddingTop: "calc(env(safe-area-inset-top, 0px) + 10px)",
        flexShrink: 0,
      }
    },
      e("span", {
        style: {
          fontWeight: 900, fontSize: "26px", fontStyle: "italic",
          color: "#F9A800",
        }
      }, "UNO"),
      e("div", { style: { display: "flex", gap: "8px" } },
        e("button", {
          onClick: () => setShowScore(true),
          style: {
            background: "#0956BF", color: "#fff", fontSize: "15px",
            fontWeight: 800, padding: "10px 12px", borderRadius: "12px",
            border: "none", cursor: "pointer", whiteSpace: "nowrap",
            fontFamily: "system-ui, sans-serif",
          }
        }, "📊 Spielstand"),
        e("button", {
          onClick: () => setShowAdd(true),
          style: {
            background: "#379711", color: "#fff", fontSize: "15px",
            fontWeight: 800, padding: "10px 12px", borderRadius: "12px",
            border: "none", cursor: "pointer", whiteSpace: "nowrap",
            fontFamily: "system-ui, sans-serif",
          }
        }, "+ Spieler"),
        e("button", {
          onClick: () => setShowResetConfirm(true),
          style: {
            background: "#444", color: "#fff", fontSize: "20px",
            fontWeight: 800, padding: "10px 14px", borderRadius: "12px",
            border: "none", cursor: "pointer",
            fontFamily: "system-ui, sans-serif",
          }
        }, "↺")
      )
    ),

    // Kacheln
    e("div", {
      style: {
        flex: 1, display: "grid",
        gridTemplateColumns: "repeat(" + cols + ", 1fr)",
        gap: "10px", padding: "0 10px 10px",
        minHeight: 0,
      }
    },
      ...players.map((p, i) => {
        const c = colorForIndex(i);
        const isFlash = flashId === p.id;
        const isLeader = p.wins > 0 && p.wins === maxWins;
        return e("div", {
          key: p.id,
          onClick: () => registerWin(p.id),
          className: isFlash ? "tile-flash" : "",
          style: {
            background: c.bg, borderRadius: "18px",
            border: "4px solid rgba(255,255,255,0.85)",
            boxShadow: isFlash
              ? "0 0 0 4px #fff, 0 0 40px " + c.glow
              : "0 6px 18px " + c.glow,
            display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center",
            padding: "8px", color: "#fff",
            position: "relative", overflow: "hidden",
            cursor: "pointer",
          }
        },
          // Krone
          isLeader ? e("span", {
            className: "crown-pop",
            style: {
              position: "absolute", top: "4px", left: "8px",
              fontSize: "28px", lineHeight: 1,
              filter: "drop-shadow(1px 1px 1px rgba(0,0,0,0.45))",
              zIndex: 2,
            }
          }, "👑") : null,

          // Minus-Knopf
          e("button", {
            onClick: ev => { ev.stopPropagation(); removeWin(p.id); },
            disabled: p.wins === 0,
            style: {
              position: "absolute", top: "6px", right: "6px",
              width: "38px", height: "38px", borderRadius: "50%",
              background: "rgba(0,0,0,0.32)", color: "#fff",
              fontSize: "26px", fontWeight: 900, lineHeight: 1,
              display: "flex", alignItems: "center", justifyContent: "center",
              border: "2px solid rgba(255,255,255,0.55)",
              opacity: p.wins === 0 ? 0.3 : 1,
              cursor: p.wins === 0 ? "default" : "pointer",
              zIndex: 2, fontFamily: "system-ui, sans-serif",
            }
          }, "−"),

          // Name
          e("span", {
            style: {
              fontSize: tileFont + "px", fontWeight: 800,
              textShadow: "1px 1px 0 rgba(0,0,0,0.35)",
              lineHeight: 1.1, textAlign: "center", wordBreak: "break-word",
            }
          }, p.name),

          // Siege
          e("span", {
            style: {
              marginTop: "6px", fontSize: (tileFont * 1.5) + "px",
              fontWeight: 900, textShadow: "2px 2px 0 rgba(0,0,0,0.35)",
            }
          }, p.wins),

          // Label
          e("span", {
            style: {
              position: "absolute", bottom: "6px",
              fontSize: "12px", fontWeight: 700,
              opacity: 0.85, letterSpacing: "1px",
            }
          }, "SIEG +1")
        );
      })
    ),

    // ===== Overlays =====

    // Spielstand
    showScore ? e(Overlay, { onClose: () => setShowScore(false), title: "Spielstand" },
      e("div", { style: { display: "flex", flexDirection: "column", gap: "4px" } },
        e("div", {
          style: {
            display: "grid", gridTemplateColumns: "60px 1fr 90px",
            fontSize: "18px", fontWeight: 800, opacity: 0.7,
            padding: "0 8px 8px", borderBottom: "2px solid #444",
          }
        },
          e("span", {}, "Platz"),
          e("span", {}, "Name"),
          e("span", { style: { textAlign: "right" } }, "Siege")
        ),
        ...sorted.map((p, idx) => {
          const leader = idx === 0 && p.wins > 0;
          return e("div", {
            key: p.id,
            style: {
              display: "grid", gridTemplateColumns: "60px 1fr 90px",
              alignItems: "center", padding: "12px 8px", borderRadius: "12px",
              background: leader ? "rgba(249,168,0,0.15)" : "transparent",
            }
          },
            e("span", { style: { fontSize: "28px", fontWeight: 900 } }, leader ? "👑" : idx+1),
            e("span", { style: { fontSize: "22px", fontWeight: 700 } }, p.name),
            e("span", {
              style: { fontSize: "30px", fontWeight: 900, textAlign: "right", color: "#F9A800" }
            }, p.wins)
          );
        })
      )
    ) : null,

    // Spieler hinzufügen
    showAdd ? e(Overlay, { onClose: () => setShowAdd(false), title: "Spieler hinzufügen" },
      e("input", {
        autoFocus: true,
        value: newName,
        onChange: ev => setNewName(ev.target.value),
        onKeyDown: ev => ev.key === "Enter" && addPlayer(),
        placeholder: "Name eingeben",
        style: {
          width: "100%", fontSize: "22px", fontWeight: 600,
          padding: "16px", borderRadius: "12px",
          border: "2px solid #444", background: "#222",
          color: "#fff", outline: "none", marginBottom: "18px",
          fontFamily: "system-ui, sans-serif",
        }
      }),
      e("button", {
        onClick: addPlayer,
        style: {
          width: "100%", background: "#379711", color: "#fff",
          fontSize: "22px", fontWeight: 900, padding: "16px",
          borderRadius: "14px", border: "none", cursor: "pointer",
          fontFamily: "system-ui, sans-serif",
        }
      }, "HINZUFÜGEN")
    ) : null,

    // Reset-Bestätigung
    showResetConfirm ? e(Overlay, { onClose: () => setShowResetConfirm(false), title: "" },
      e("div", { style: { textAlign: "center" } },
        e("div", { style: { fontSize: "54px", marginBottom: "8px" } }, "⚠️"),
        e("div", { style: { fontSize: "24px", fontWeight: 800, marginBottom: "24px" } },
          "Spiel wirklich zurücksetzen?"),
        e("div", { style: { display: "flex", flexDirection: "column", gap: "12px" } },
          e("button", {
            onClick: resetScores,
            style: {
              background: "#F9A800", color: "#000", fontSize: "19px",
              fontWeight: 900, padding: "16px", borderRadius: "14px",
              border: "none", cursor: "pointer", fontFamily: "system-ui, sans-serif",
            }
          }, "NUR PUNKTE ZURÜCKSETZEN"),
          e("button", {
            onClick: fullReset,
            style: {
              background: "#D72600", color: "#fff", fontSize: "19px",
              fontWeight: 900, padding: "16px", borderRadius: "14px",
              border: "none", cursor: "pointer", fontFamily: "system-ui, sans-serif",
            }
          }, "KOMPLETT NEU STARTEN"),
          e("button", {
            onClick: () => setShowResetConfirm(false),
            style: {
              background: "#333", color: "#fff", fontSize: "19px",
              fontWeight: 800, padding: "16px", borderRadius: "14px",
              border: "none", cursor: "pointer", fontFamily: "system-ui, sans-serif",
            }
          }, "ABBRECHEN")
        )
      )
    ) : null
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(e(App));
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
