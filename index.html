// Web Audio API: vorab dekodierte Fanfare für zuverlässige Wiedergabe (auch auf iOS)
let _audioCtx = null;
let _fanfareBuffer = null;
let _fanfareLoading = null;

function getAudioCtx() {
  if (!_audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) _audioCtx = new AudioCtx();
  }
  return _audioCtx;
}

function base64ToArrayBuffer(dataUri) {
  const b64 = dataUri.split(",")[1] || dataUri;
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function ensureFanfareLoaded() {
  if (_fanfareBuffer) return _fanfareBuffer;
  if (_fanfareLoading) return _fanfareLoading;
  const ctx = getAudioCtx();
  if (!ctx) return null;
  _fanfareLoading = new Promise((resolve) => {
    try {
      const arrayBuf = base64ToArrayBuffer(FANFARE_AUDIO);
      ctx.decodeAudioData(
        arrayBuf,
        (decoded) => {
          _fanfareBuffer = decoded;
          resolve(decoded);
        },
        () => resolve(null)
      );
    } catch (e) {
      resolve(null);
    }
  });
  return _fanfareLoading;
}

async function playFanfare() {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") {
      try { await ctx.resume(); } catch (e) {}
    }
    const buffer = await ensureFanfareLoaded();
    if (!buffer) return;
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.value = 1.0;
    source.connect(gain);
    gain.connect(ctx.destination);
    source.start(0);
  } catch (e) {
    // still nichts tun, falls Audio blockiert ist
  }
}

// ===== Konfetti =====
function Confetti({ run }) {
  if (!run) return null;
  const pieces = Array.from({ length: 90 });
  const palette = ["#D72600", "#F9A800", "#379711", "#0956BF", "#FFFFFF"];
  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        pointerEvents: "none",
        overflow: "hidden",
        zIndex: 60,
      }}
    >
      {pieces.map((_, i) => {
        const left = Math.random() * 100;
        const delay = Math.random() * 0.3;
        const dur = 1.6 + Math.random() * 1.4;
        const size = 8 + Math.random() * 10;
        const color = palette[i % palette.length];
        const rot = Math.random() * 360;
        const drift = (Math.random() - 0.5) * 120;
        return (
          <span
            key={i}
            style={{
              position: "absolute",
              top: "-24px",
              left: `${left}%`,
              width: `${size}px`,
              height: `${size * 1.4}px`,
              background: color,
              borderRadius: "2px",
              transform: `rotate(${rot}deg)`,
              animation: `confettiFall ${dur}s ${delay}s ease-in forwards`,
              "--drift": `${drift}px`,
            }}
          />
        );
      })}
    </div>
  );
}

  const [setupNames, setSetupNames] = useState(["", ""]);

  const [showScore, setShowScore] = useState(false);

  const [confetti, setConfetti] = useState(false);
  const [flashId, setFlashId] = useState(null);
  const idRef = useRef(1);

  // Audio einmalig vorladen
  useEffect(() => {
    ensureFanfareLoaded();
  }, []);

  function setupCountChange(n) {
    const count = Math.max(2, Math.min(15, n));
    setNumInput(count);
    setSetupNames((prev) => {
      const next = prev.slice(0, count);
      while (next.length < count) next.push("");
      return next;
    });
  }

  function startGame() {
    const built = setupNames.map((nm, i) => ({
      id: idRef.current++,
      name: nm.trim() || `Spieler ${i + 1}`,
      wins: 0,
    }));
    setPlayers(built);
    setPhase("game");
  }

  function registerWin(id) {
    // Audio anstoßen (durch Nutzer-Tap -> iOS erlaubt Wiedergabe)
    playFanfare();
    setPlayers((prev) =>
      prev.map((p) => (p.id === id ? { ...p, wins: p.wins + 1 } : p))
    );
    setFlashId(id);
    setConfetti(false);
    // im nächsten Frame neu starten, damit die Animation immer triggert
    requestAnimationFrame(() => setConfetti(true));
    setTimeout(() => setConfetti(false), 3200);
    setTimeout(() => setFlashId(null), 700);
  }

  function removeWin(id) {
    // einen Sieg abziehen, niemals unter 0 — ohne Fanfare/Konfetti
    setPlayers((prev) =>
      prev.map((p) =>
        p.id === id ? { ...p, wins: Math.max(0, p.wins - 1) } : p
      )
    );
  }

  function addPlayer() {
    const nm = newName.trim();
    setPlayers((prev) => [
      ...prev,
      { id: idRef.current++, name: nm || `Spieler ${prev.length + 1}`, wins: 0 },
    ]);
    setNewName("");
    setShowAdd(false);
  }

  function resetScores() {
    setPlayers((prev) => prev.map((p) => ({ ...p, wins: 0 })));
    setShowResetConfirm(false);
    setShowScore(false);
  }

  function fullReset() {
    setPlayers([]);
    setPhase("setup");
    setNumInput(2);
    setSetupNames(["", ""]);
    setShowResetConfirm(false);
    setShowScore(false);

              padding: "18px",
              borderRadius: 16,
              boxShadow: "0 8px 24px rgba(55,151,17,0.45)",
              letterSpacing: 1,
            }}
          >
            SPIEL STARTEN
          </button>
        </div>
      )}

      {/* ===== GAME ===== */}
      {phase === "game" && (
        <div
          style={{
            flex: 1,
            display: "flex",
            flexDirection: "column",
            minHeight: 0,
            padding: "10px 10px 0",
            paddingTop: "calc(env(safe-area-inset-top, 0px) + 14px)",
          }}
        >
          {/* Topbar */}
          <div
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              padding: "6px 6px 10px",
              flexShrink: 0,
            }}
          >
            <span
              style={{
                fontWeight: 900,
                fontSize: 26,
                fontStyle: "italic",
                color: "#F9A800",
                WebkitTextStroke: "1px #000",
              }}
            >
              UNO
            </span>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setShowScore(true)} style={topBtn("#0956BF")}>
                📊 Spielstand
              </button>
              <button onClick={() => setShowAdd(true)} style={topBtn("#379711")}>
                ＋ Spieler
              </button>
              <button
                onClick={() => setShowResetConfirm(true)}
                style={topBtn("#444")}
                title="Spiel zurücksetzen"
              >
                ↺
              </button>
            </div>
          </div>

          {/* Spieler-Kacheln */}
          <div
            style={{
              flex: 1,
              display: "grid",
              gridTemplateColumns: `repeat(${cols}, 1fr)`,
              gap: 10,
              paddingBottom: 10,
              minHeight: 0,
            }}
          >
            {players.map((p, i) => {
              const c = colorForIndex(i);
              const isFlash = flashId === p.id;
              const isLeader = p.wins > 0 && p.wins === maxWins;
              return (
                <div
                  key={p.id}
                  role="button"
                  onClick={() => registerWin(p.id)}
                  style={{
                    background: c.bg,
                    borderRadius: 18,
                    border: "4px solid rgba(255,255,255,0.85)",
                    boxShadow: isFlash
                      ? `0 0 0 4px #fff, 0 0 40px ${c.glow}`
                      : `0 6px 18px ${c.glow}`,
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    justifyContent: "center",
                    padding: 8,
                    color: "#fff",
                    animation: isFlash ? "popFlash 0.6s ease" : "none",
                    position: "relative",
                    overflow: "hidden",
                    cursor: "pointer",
                  }}
                >
                  {/* Krone für den/die Führenden */}
                  {isLeader && (
                    <span
                      aria-label="Führend"
                      style={{
                        position: "absolute",
                        top: 4,
                        left: 8,
                        fontSize: 30,
                        lineHeight: 1,
                        filter: "drop-shadow(1px 1px 1px rgba(0,0,0,0.45))",
                        animation: "crownPop 0.4s ease",
                        zIndex: 2,
                      }}
                    >
                      👑
                    </span>
                  )}
                  {/* Minus-Knopf: einen Sieg abziehen */}
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      removeWin(p.id);
                    }}
                    disabled={p.wins === 0}
                    aria-label="Einen Sieg abziehen"
                    style={{
                      position: "absolute",
                      top: 6,
                      right: 6,
                      width: 38,
                      height: 38,
                      borderRadius: "50%",
                      background: "rgba(0,0,0,0.32)",
                      color: "#fff",
                      fontSize: 26,
                      fontWeight: 900,
                      lineHeight: 1,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      border: "2px solid rgba(255,255,255,0.55)",
                      opacity: p.wins === 0 ? 0.3 : 1,
                      zIndex: 2,
                    }}
                  >
                    −
                  </button>
                  <span
                    style={{
                      fontSize: tileFont,
                      fontWeight: 800,
                      textShadow: "1px 1px 0 rgba(0,0,0,0.35)",
                      lineHeight: 1.1,
                      textAlign: "center",
                      wordBreak: "break-word",
                    }}
                  >
                    {p.name}
                  </span>
                  <span
                    style={{
                      marginTop: 6,
                      fontSize: tileFont * 1.5,
                      fontWeight: 900,
                      textShadow: "2px 2px 0 rgba(0,0,0,0.35)",
                    }}
                  >
                    {p.wins}
                  </span>
                  <span
                    style={{
                      position: "absolute",
                      bottom: 6,
                      fontSize: 13,
                      fontWeight: 700,
                      opacity: 0.85,
                      letterSpacing: 1,
                    }}
                  >
                    SIEG +1
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ===== Spielstand-Overlay ===== */}
      {showScore && (
        <Overlay onClose={() => setShowScore(false)} title="Spielstand">
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "60px 1fr 90px",
                fontSize: 24,
                fontWeight: 800,
                opacity: 0.7,
                padding: "0 8px 8px",
                borderBottom: "2px solid #444",
              }}
            >
              <span>Platz</span>
              <span>Name</span>
              <span style={{ textAlign: "right" }}>Siege</span>
            </div>
            {sorted.map((p, idx) => {
              const leader = idx === 0 && p.wins > 0;
              return (
                <div
                  key={p.id}
                  style={{
                    display: "grid",
                    gridTemplateColumns: "60px 1fr 90px",
                    alignItems: "center",
                    padding: "12px 8px",
                    borderRadius: 12,
                    background: leader ? "rgba(249,168,0,0.15)" : "transparent",
                  }}
                >
                  <span style={{ fontSize: 32, fontWeight: 900 }}>
                    {leader ? "👑" : idx + 1}
                  </span>
                  <span style={{ fontSize: 28, fontWeight: 700 }}>{p.name}</span>
                  <span
                    style={{
                      fontSize: 36,
                      fontWeight: 900,
                      textAlign: "right",
                      color: "#F9A800",
                    }}
                  >
                    {p.wins}
                  </span>
                </div>
              );
            })}
          </div>
        </Overlay>
      )}

      {/* ===== Spieler-hinzufügen-Overlay ===== */}
      {showAdd && (
        <Overlay onClose={() => setShowAdd(false)} title="Spieler hinzufügen">
          <input
            autoFocus
            value={newName}
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addPlayer()}
            placeholder="Name eingeben"
            style={{
              width: "100%",
              fontSize: 22,
              fontWeight: 600,
              padding: "16px",
              borderRadius: 12,
              border: "2px solid #444",
              background: "#222",
              color: "#fff",
              outline: "none",
              marginBottom: 18,
            }}
          />
          <button
            onClick={addPlayer}
            style={{
              width: "100%",
              background: "#379711",
              color: "#fff",
              fontSize: 22,
              fontWeight: 900,
              padding: "16px",
              borderRadius: 14,
              letterSpacing: 1,
            }}
          >
            HINZUFÜGEN
          </button>
        </Overlay>
      )}

      {/* ===== Reset-Bestätigung ===== */}
      {showResetConfirm && (
        <Overlay onClose={() => setShowResetConfirm(false)} title="">
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 54, marginBottom: 8 }}>⚠️</div>
            <div style={{ fontSize: 26, fontWeight: 800, marginBottom: 24 }}>
              Spiel wirklich löschen?
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <button
                onClick={resetScores}
                style={{
                  background: "#F9A800",
                  color: "#000",
                  fontSize: 20,
                  fontWeight: 900,
                  padding: "16px",
                  borderRadius: 14,
                }}
              >
                NUR PUNKTE ZURÜCKSETZEN
              </button>
              <button
                onClick={fullReset}
                style={{
                  background: "#D72600",
                  color: "#fff",
                  fontSize: 20,
                  fontWeight: 900,
                  padding: "16px",
                  borderRadius: 14,
                }}
              >
                KOMPLETT NEU STARTEN
              </button>
              <button
                onClick={() => setShowResetConfirm(false)}
                style={{
                  background: "#333",
                  color: "#fff",
                  fontSize: 20,
                  fontWeight: 800,
                  padding: "16px",
                  borderRadius: 14,
                }}
              >
                ABBRECHEN
              </button>
            </div>
          </div>
        </Overlay>
      )}
    </div>
  );
}

function Overlay({ children, onClose, title }) {
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(0,0,0,0.75)",
        zIndex: 50,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 18,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "#1c1c1c",
          borderRadius: 22,
          padding: "24px 20px",
          width: "100%",
          maxWidth: 480,
          maxHeight: "85vh",
          overflowY: "auto",
          border: "3px solid #333",
          boxShadow: "0 20px 60px rgba(0,0,0,0.6)",
          animation: "overlayIn 0.25s ease",
        }}
      >
        {title ? (
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              marginBottom: 20,
            }}
          >
            <span style={{ fontSize: 28, fontWeight: 900, color: "#F9A800" }}>
              {title}
            </span>
            <button
              onClick={onClose}
              style={{
                background: "#333",
                color: "#fff",
                width: 40,
                height: 40,
                borderRadius: "50%",
                fontSize: 22,
                fontWeight: 800,
              }}
            >
              ✕
            </button>
          </div>
        ) : null}
        {children}
      </div>
    </div>
  );
}

const stepperBtn = {
  width: 48,
  height: 48,
  borderRadius: 12,
  background: "#333",
  color: "#fff",
  fontSize: 30,
  fontWeight: 900,
  flexShrink: 0,
};

function topBtn(bg) {
  return {
    background: bg,
    color: "#fff",
    fontSize: 16,
    fontWeight: 800,
    padding: "10px 12px",
    borderRadius: 12,
    whiteSpace: "nowrap",
  };
}


const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
